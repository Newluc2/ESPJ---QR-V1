services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Paris
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5772:80"
    environment:
      - TZ=Europe/Paris
    depends_on:
      - server
    restart: unless-stopped
